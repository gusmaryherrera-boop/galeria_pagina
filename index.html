<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background: #0b5ed7;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .banner img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .contenedor {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 20px 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.15);
            text-align: center;
        }

        /* Retícula responsive para organizar las imágenes */
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 15px;
        }

        .item-galeria {
            border-radius: 8px;
            overflow: hidden;
            background: #fafafa;
            border: 1px solid #e0e0e0;
        }

        .item-galeria img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

       
    </style>
</head>

<body>

<header>
    <img src="static/imagenes/logo.jpg" alt="Logo ">
    <h1>Liceo Nueva Generacion</h1>
</header>

<div class="banner">
    <img src="static/imagenes/marca1.jpg" alt="Imagen principal">
</div>

<div class="contenedor">
    <div class="card">
        <div class="galeria-grid">
            <div class="item-galeria">
                <img src="static/imagenes/parv.jpg" >
            </div>
            <div class="item-galeria">
                <img src="static/imagenes/prim.jpg" >
            </div>
            <div class="item-galeria">
                <img src="static/imagenes/basico.jpg" >
            </div>
            <div class="item-galeria">
                <img src="static/imagenes/compu.jpg" >
            </div>
             <div class="item-galeria">
                <img src="static/imagenes/compu.jpg" >
            </div>
             <div class="item-galeria">
                <img src="static/imagenes/compu.jpg" >
            </div>
        </div>
    </div>
</div>



</body>
</html>
